name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e './backend[dev]'
      - run: ruff check backend
      - run: black --check backend/app/main.py
      - run: black --check backend/app/schemas.py
      - run: black --check backend/scripts/fetch_data.py
      - run: black --check backend/tests/test_api.py
      - run: black --check backend/tests/test_metrics.py
      - run: pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd frontend && npm ci
      - run: cd frontend && npm test -- --passWithNoTests
      - run: cd frontend && npm run build
